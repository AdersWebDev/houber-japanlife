<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<meta name="admin-token" th:content="${token}">
<title>글 관리 | 하우버 관리자</title><link rel="stylesheet" href="/admin-assets/admin.css"></head>
<body>
<div class="head">
  <div class="left"><img src="/asset/logo.png" alt="Houber"><nav><a href="/admin/write">새 글 쓰기</a><a class="on" href="/admin/posts">글 관리</a><a href="/" target="_blank">사이트로 이동 ↗</a></nav></div>
  <div class="right"><form method="post" action="/admin/logout" style="margin:0"><input type="hidden" name="_token" th:value="${token}"><button class="btn small">로그아웃</button></form></div>
</div>
<div class="wrap">
  <div class="filter">
    <h1 class="page-title" style="margin:0">글 관리 <span style="color:#999;font-size:14px;font-weight:400" th:text="${rows.size()} + '개'"></span></h1>
    <select onchange="location.href='/admin/posts' + (this.value ? '?category=' + this.value : '')">
      <option value="">전체 카테고리</option>
      <option th:each="c : ${categories}" th:value="${c.name()}" th:text="${c.title}" th:selected="${c == selected}"></option>
    </select>
  </div>
  <table class="list">
    <tr><th>글</th><th>카테고리</th><th>상태</th><th>수정일</th><th>조회</th><th></th></tr>
    <tr th:each="r : ${rows}" th:attr="data-id=${r.id}">
      <td class="title"><div class="t"><img th:src="${r.thumbnailUrl}" alt="" loading="lazy"><a th:href="'/detail/' + ${r.id}" target="_blank" th:text="${r.title}"></a></div></td>
      <td th:text="${r.category.title}"></td>
      <td><span th:if="${r.show}" class="on1">● 노출</span><span th:unless="${r.show}" class="off1">○ 숨김</span></td>
      <td th:text="${r.modifiedDate == null ? '' : #temporals.format(r.modifiedDate, 'yyyy-MM-dd')}"></td>
      <td th:text="${r.view}"></td>
      <td>
        <a class="btn small" th:href="'/admin/write/' + ${r.id}">수정</a>
        <button class="btn small" th:if="${r.show}" onclick="setShow(this, false)">숨기기</button>
        <button class="btn small" th:unless="${r.show}" onclick="setShow(this, true)">노출하기</button>
        <button class="btn small red" onclick="removePost(this)">삭제</button>
      </td>
    </tr>
  </table>
</div>
<div class="toast" id="toast"></div>
<script src="/admin-assets/posts.js"></script>
</body>
</html>
