<!DOCTYPE html>
<html lang="ko">
<head th:replace="~{fragments/head :: head(
    title=${title},
    description=${description},
    keywords=${keywords},
    siteUrl=${siteUrl},
    thumbnail=${thumbnail}
    )}"></head>
<body>
<div th:replace="~{fragments/go-top :: go-top}"></div>
<section class="content">

  <div class="page-layout">
    <div class="layout-main">
        <header th:replace="~{fragments/header :: header}"></header>
  <div th:replace="~{fragments/searchBar :: searchBar}"></div>
    <section class="detail-content">

      <div id="indexing-control" th:if="${!(tableOfContents.size() < 1)}">
        <img th:src="@{/asset/indexing-controller.png}" alt="내부 목차 열기(open aside)">
      </div>
      <aside id="indexing-modal" th:if="${!(tableOfContents.size() < 1)}">
        <h3>Index</h3>
        <ul>
          <li th:each="item : ${tableOfContents}">
            <a th:href="'#' + ${item['id']}">
              <span th:text="${item['text']}"></span>
            </a>
          </li>
        </ul>
      </aside>

      <div id="detail-content">
        <div class="detail-header">
          <h1 th:text="${h1}"></h1>
          <p class="detail-date s" th:if="${publishedText != null}">게시 <time th:datetime="${publishedIso}" th:text="${publishedText}"></time><th:block th:if="${modifiedText != null}"> · 수정 <time th:datetime="${modifiedIso}" th:text="${modifiedText}"></time></th:block></p>
          <div class="detail-header-under">
            <span class="s">
              <a href="/" style="text-decoration: none; color: #fff">메인</a>
              >
              <a th:href="@{/list(category=${category})}" th:text="${category.title}" style="text-decoration: none; color: #fff"></a>
            </span>
            <div class="view-count-box">
              <img th:src="@{/asset/viewCount.png}" alt="게시글이 읽힌 수(counting post view)">
              <span class="s" th:text="${view}"></span>
            </div>
          </div>
        </div>
        <th:block th:utext="${mainContent}"></th:block>
      </div>
      <div id="contact-us"></div>
      <div th:if="${not #lists.isEmpty(moreContents)}" class="slider-container">
        <h2>이어지는 가이드를 보여드릴게요!</h2>
        <div class="slider">
          <div th:each="item : ${moreContents}" class="item">
            <a th:href="${item.link}">
              <div class="image-wrapper">
                <img th:src = "${item.thumbnailUrl}"
                     th:alt = "${item.title}" loading="lazy">
                <div class="title" th:text = "${item.title}"></div>
              </div>
            </a>
          </div>
        </div>
      </div>

    </section>
    </div>
    <div class="layout-nav-wrapper" id="category-nav-wrapper">
      <nav id="category-box" th:replace="~{fragments/category :: category(new_value=${new_value})}"></nav>
    </div>
  </div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</section>
</body>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/navControl.js}"></script>
<script th:src="@{/js/asideControl.js}"></script>
<script th:src="@{/js/slideItem.js}"></script>
<script>
    // 카카오 SDK는 공통 go-top 영역에서 한 번만 불러옴 (중복 로드 제거)
    document.getElementById("contact-us").addEventListener("click", houberKakaoChat);
</script>
</html>
