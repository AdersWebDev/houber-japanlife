<head th:fragment="head(title, description, keywords, siteUrl, thumbnail)">
  <title th:text="${title}">Default Title</title>
  <meta charset="UTF-8">
  <!-- 오류·검색 결과 페이지는 컨트롤러에서 noindex=true -->
  <meta name="robots" th:content="${noindex != null and noindex} ? 'noindex, follow' : 'index, follow'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" th:content="${description}">
  <meta name="keywords" th:content="${keywords}">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="frame-src 'self' https://www.youtube.com https://www.instagram.com/;">
  <meta name="format-detection" content="telephone=no">
  <meta name="thumbnail" th:content="${thumbnail}"><!-- -->

  <meta property="og:locale" content="ko_KR">
  <meta property="og:site_name" content="houber-japanlife.com">
  <!-- 글 상세는 article, 홈·목록 등은 website -->
  <meta property="og:type" th:content="${ogType != null} ? ${ogType} : 'website'">
  <meta property="og:title" th:content="${title}">
  <meta property="og:url" th:content="${siteUrl}">
  <meta property="og:description" th:content="${description}">
  <meta property="og:image" th:content="${thumbnail}">

  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" th:content="${title}">
  <meta property="twitter:description" th:content="${description}">
  <meta property="twitter:image" th:content="${thumbnail}">
  <meta name="twitter:creator" content="@houber">

  <link rel="preload" th:href="@{/css/main.css}" as="style">
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="canonical" th:if="${noindex == null or !noindex}" th:href="${siteUrl}">

  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/frag/header.css}">
  <link rel="stylesheet" th:href="@{/css/frag/footer.css}">
  <link rel="stylesheet" th:href="@{/css/frag/go-top.css}">
  <link rel="stylesheet" th:href="@{/css/frag/searchBar.css}">
  <link rel="stylesheet" th:href="@{/css/frag/category.css}">
  <link rel="stylesheet" th:href="@{/css/frag/content.css}">
  <link rel="stylesheet" th:href="@{/css/frag/indexing.css}">
  <link rel="stylesheet" th:href="@{/css/mainPage.css}">
  <link rel="stylesheet" th:href="@{/css/frag/grid-items.css}">
  <link rel="stylesheet" th:href="@{/css/detail.css}">
  <link rel="stylesheet" th:href="@{/css/searchPage.css}">
  <link rel="stylesheet" th:href="@{/css/frag/youtube.css}">
  <link rel="icon" th:href="@{/asset/favicon.png}" type="image/png"/>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T53KFWQ2QF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-T53KFWQ2QF');
  </script>
</head>
