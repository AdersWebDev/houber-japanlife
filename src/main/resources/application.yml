server:
  port: 40002
  servlet:
    session:
      tracking-modes: cookie # 주소에 ;jsessionid가 붙지 않게
      cookie:
        same-site: strict
        http-only: true
management:
  endpoints:
    web:
      exposure:
        include: '*'
spring:
  application:
    name: houber-city;
  config:
    # 관리자 비밀번호(admin.password)는 저장소가 아니라 서버의 ~/japanlife/admin.yml에 둔다
    import: optional:file:./admin.yml,optional:file:/home/ec2-user/japanlife/admin.yml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ENC(cR1lVrscKe+ScuVh1R5uOFgIpbKdunx9L29qp9s+CHpjRJLiKEApu3sTU6HLDzXWHWYa8+pKB5mDXWXayo9B3zbak43OzpkD+fNNNXMkrRnob2ECm4Yg7HbUpGYnGQRDzBD83T62XkQ=)
    username: ENC(bLOV1rhg9qGgt4R9n83J4fEcY6zmIMZe)
    password: ENC(QqOaryyb5bffJFi2dMss5OdV+bY50SFY)
  jpa:
    hibernate:
      ddl-auto: update
  thymeleaf:
    cache: false
  web:
    resources:
      # 정적 파일(css/js/이미지) 주소에 파일 내용 해시를 붙임 (예: /css/main-<해시>.css).
      # 파일이 바뀌면 주소도 바뀌므로 브라우저가 1년 동안 캐시해도 항상 최신 파일을 받는다.
      # 캐시 헤더는 seo/StaticCacheFilter에서 붙임 (해시 붙은 주소: 1년, 해시 없는 주소: 매번 변경 확인)
      chain:
        cache: true
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**,/asset/**,/admin-assets/**
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 100
          max-idle: 30
          min-idle: 5
          max-wait: 5000
      password: ENC(c1UTTrEa7dcw6s2hMFu5tTsKqzzmMjZXR85zgR89CwM=)

